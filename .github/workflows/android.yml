name: GLACIA Android CI

on:
  push:
    branches: [main, feature/phase-2-tdlib-auth, feature/phase-3-messaging, feature/phase-3-1-media, feature/phase-3-2-playback]
  pull_request:
    branches: [main, feature/phase-2-tdlib-auth, feature/phase-3-messaging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android SDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
      - name: Compile demo and run JVM tests
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Upload unsigned debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GLACIA-phase3-2-unconfigured-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
